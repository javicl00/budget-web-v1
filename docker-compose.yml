services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budgetdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  api:
    build: ./backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://budget:budget@db:5432/budgetdb
      CORS_ORIGINS_RAW: "http://localhost:5173,http://localhost:8000,http://localhost"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
volumes:
  pgdata:
